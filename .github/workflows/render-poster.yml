name: Render Poster Animation

on:
  push:
    branches:
      - main
    paths:
      - 'src/poster/**'
      - 'public/images/**'
      - 'scripts/generate-poster-audio.mjs'
      - '.github/workflows/render-poster.yml'
  workflow_dispatch:

jobs:
  render:
    name: Render High-Energy GAMESDAPP Poster + Gaming BGM (1080x1350)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies for Headless Chrome & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0t64 \
            libgbm-dev \
            libasound2t64 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libatk-bridge2.0-0t64 \
            libpango-1.0-0 \
            libcairo2 \
            libcups2t64 || \
          sudo apt-get install -y ffmpeg \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libgbm-dev \
            libasound2 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libatk-bridge2.0-0 \
            libpango-1.0-0 \
            libcairo2 \
            libcups2

      - name: Install NPM Packages
        run: npm install

      - name: Generate 128 BPM Gaming Synthwave BGM & Frame-Synced SFX
        run: |
          node scripts/generate-poster-audio.mjs
          ls -lh public/audio/poster-bgm.wav

      - name: Typecheck Project
        run: npx tsc --noEmit

      - name: Ensure Remotion Browser
        run: npx remotion browser ensure

      - name: Render Poster Animation with Audio (Raw)
        run: |
          npx remotion render src/poster/index.ts PosterAnimation out/poster-raw.mp4 \
            --codec=h264 \
            --pixel-format=yuv420p \
            --audio-codec=aac \
            --jpeg-quality=95 \
            --concurrency=2

      - name: Optimize MP4 + AAC Audio for Mobile (Faststart, CFR 30fps)
        run: |
          ffmpeg -y -i out/poster-raw.mp4 \
            -c:v libx264 -profile:v high -level:v 4.1 -pix_fmt yuv420p \
            -preset medium -crf 16 -g 30 -keyint_min 30 -sc_threshold 0 \
            -r 30 -vsync cfr \
            -c:a aac -b:a 192k -ar 44100 \
            -movflags +faststart \
            out/gamesdapp-poster-animation.mp4
          ls -lh out/gamesdapp-poster-animation.mp4

      - name: Upload Video as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamesdapp-poster-high-energy-with-bgm-mp4
          path: out/gamesdapp-poster-animation.mp4
          retention-days: 14
