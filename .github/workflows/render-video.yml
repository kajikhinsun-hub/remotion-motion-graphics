name: Render Motion Graphics Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    name: Render 65s Documentary (Keajaiban Alam Semesta)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies for Headless Chrome (Ubuntu 22.04 / 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0t64 \
            libgbm-dev \
            libasound2t64 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libatk-bridge2.0-0t64 \
            libpango-1.0-0 \
            libcairo2 \
            libcups2t64 || \
          sudo apt-get install -y \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libgbm-dev \
            libasound2 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libatk-bridge2.0-0 \
            libpango-1.0-0 \
            libcairo2 \
            libcups2

      - name: Install NPM Packages
        run: npm install

      - name: Typecheck Project
        run: npx tsc --noEmit

      - name: Ensure Remotion Browser
        run: npx remotion browser ensure

      - name: Render Video (MP4 - 1920x1080 @ 30fps, 65s)
        run: npx remotion render src/index.ts MainVideo out/keajaiban-alam-semesta.mp4 --concurrency=100%

      - name: Upload Video as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keajaiban-alam-semesta-mp4
          path: out/keajaiban-alam-semesta.mp4
          retention-days: 14
