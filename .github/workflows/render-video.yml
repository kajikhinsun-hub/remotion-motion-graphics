name: Render Motion Graphics Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    name: Render 65s Documentary with Indonesian Narrator VO & Full Soundscape
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies for Headless Chrome & FFmpeg (Ubuntu 22.04 / 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0t64 \
            libgbm-dev \
            libasound2t64 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libatk-bridge2.0-0t64 \
            libpango-1.0-0 \
            libcairo2 \
            libcups2t64 || \
          sudo apt-get install -y ffmpeg python3-pip \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libgbm-dev \
            libasound2 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libatk-bridge2.0-0 \
            libpango-1.0-0 \
            libcairo2 \
            libcups2

      - name: Install NPM Packages
        run: npm install

      - name: Generate 5 Multi-Channel Soundscape WAV Tracks
        run: node scripts/generate-audio.mjs

      - name: Generate Indonesian Documentary Narrator Voiceover (Neural TTS)
        run: |
          pip install --break-system-packages edge-tts gTTS || pip install edge-tts gTTS
          python3 scripts/generate-voiceover.py
          ls -lh public/audio/vo/

      - name: Typecheck Project
        run: npx tsc --noEmit

      - name: Ensure Remotion Browser
        run: npx remotion browser ensure

      - name: Render Video (Raw Remotion MP4)
        run: |
          npx remotion render src/index.ts MainVideo out/raw-render.mp4 \
            --codec=h264 \
            --pixel-format=yuv420p \
            --audio-codec=aac \
            --concurrency=2

      - name: Optimize MP4 Stream for Mobile & Universal Hardware Decoders (No Freeze / Faststart)
        run: |
          ffmpeg -y -i out/raw-render.mp4 \
            -c:v libx264 -profile:v high -level:v 4.1 -pix_fmt yuv420p \
            -preset medium -crf 18 -g 30 -keyint_min 30 -sc_threshold 0 \
            -r 30 -vsync cfr \
            -c:a aac -b:a 192k -ar 44100 \
            -movflags +faststart \
            out/keajaiban-alam-semesta.mp4
          ls -lh out/keajaiban-alam-semesta.mp4

      - name: Upload Video as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keajaiban-alam-semesta-narrated-mp4
          path: out/keajaiban-alam-semesta.mp4
          retention-days: 14
