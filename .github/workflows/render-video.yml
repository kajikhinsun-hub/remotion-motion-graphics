name: Render Motion Graphics Video

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      titleText:
        description: 'Judul Utama Video'
        required: true
        default: 'Motion Graphics Otomatis'
      subtitleText:
        description: 'Subjudul Video'
        required: true
        default: 'Dirender di Cloud via GitHub Actions'
      accentColor:
        description: 'Warna Aksen (Hex)'
        required: true
        default: '#38bdf8'

jobs:
  render:
    name: Render MP4 with Remotion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies for Headless Chrome (Ubuntu 22.04 / 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0t64 \
            libgbm-dev \
            libasound2t64 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libatk-bridge2.0-0t64 \
            libpango-1.0-0 \
            libcairo2 \
            libcups2t64 || \
          sudo apt-get install -y \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libgbm-dev \
            libasound2 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libatk-bridge2.0-0 \
            libpango-1.0-0 \
            libcairo2 \
            libcups2

      - name: Install NPM Packages
        run: npm install

      - name: Ensure Remotion Browser
        run: npx remotion browser ensure

      - name: Create Props JSON
        env:
          TITLE_TEXT: ${{ github.event.inputs.titleText || 'Motion Graphics Otomatis' }}
          SUBTITLE_TEXT: ${{ github.event.inputs.subtitleText || 'Dirender dengan Remotion & GitHub Actions' }}
          ACCENT_COLOR: ${{ github.event.inputs.accentColor || '#38bdf8' }}
        run: |
          jq -n \
            --arg title "$TITLE_TEXT" \
            --arg subtitle "$SUBTITLE_TEXT" \
            --arg color "$ACCENT_COLOR" \
            '{titleText: $title, subtitleText: $subtitle, accentColor: $color}' > props.json
          cat props.json

      - name: Render Video (MP4)
        run: npx remotion render src/index.ts MainVideo out/video.mp4 --props=./props.json

      - name: Upload Video as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-motion-graphics
          path: out/video.mp4
          retention-days: 14
