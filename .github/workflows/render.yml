name: Render Kinetic Typography Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    name: Typecheck, Render 4 Stills & Render Main MP4 (1080x1920)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux Dependencies for Headless Chrome & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0t64 \
            libgbm-dev \
            libasound2t64 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libatk-bridge2.0-0t64 \
            libpango-1.0-0 \
            libcairo2 \
            libcups2t64 || \
          sudo apt-get install -y ffmpeg \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libgbm-dev \
            libasound2 \
            libxrandr2 \
            libxkbcommon-dev \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libatk-bridge2.0-0 \
            libpango-1.0-0 \
            libcairo2 \
            libcups2

      - name: Install Dependencies (npm ci)
        run: npm ci

      - name: Run TypeScript Typecheck (npx tsc --noEmit)
        run: npx tsc --noEmit

      - name: Ensure Remotion Browser
        run: npx remotion browser ensure

      - name: Render 4 Verification Stills (Frames 90, 600, 760, 1000)
        run: |
          mkdir -p out/stills
          npx remotion still Main out/stills/frame-0090.png --frame=90
          npx remotion still Main out/stills/frame-0600.png --frame=600
          npx remotion still Main out/stills/frame-0760.png --frame=760
          npx remotion still Main out/stills/frame-1000.png --frame=1000
          ls -lh out/stills/

      - name: Upload 4 Verification Stills Artifact
        uses: actions/upload-artifact@v4
        with:
          name: verification-stills
          path: out/stills/*.png
          retention-days: 14

      - name: Render Full Vertical MP4 Video (1080x1920 @ 30fps, 1147 frames)
        run: |
          npx remotion render Main out/video.mp4 --concurrency=2
          ls -lh out/video.mp4

      - name: Upload Rendered MP4 Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-video-mp4
          path: out/video.mp4
          retention-days: 14
